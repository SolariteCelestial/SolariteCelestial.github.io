<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHELTER 13</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0c04;--bg2:#151208;
  --amber:#e0aa18;--amber-dim:#8a6418;--amber-glow:#ffd040;
  --red:#c03030;--red-bright:#e85050;
  --text:#d4a030;--text-dim:#8a6a28;
  --border:#2e2410;--purple:#9058c8;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Courier New',Courier,monospace;font-size:13px;line-height:1.5;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);pointer-events:none;z-index:9999}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5) 100%);pointer-events:none;z-index:9998}

/* ── LAYOUT ── */
#game{display:flex;height:100vh;max-width:1280px;margin:0 auto;position:relative}
#header{position:absolute;top:0;left:0;right:0;padding:6px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:100;background:var(--bg);max-width:1280px;margin:0 auto}
#title{font-size:15px;letter-spacing:5px;color:var(--amber-glow);text-shadow:0 0 12px var(--amber),0 0 28px rgba(200,150,12,.2);animation:flicker 14s infinite}
#hud-r{color:var(--text-dim);font-size:10px;letter-spacing:2px;text-align:right;line-height:1.9}

/* LOG — 25% */
#log-panel{flex:0 0 22%;margin-top:37px;overflow-y:auto;padding:10px 12px;border-right:1px solid var(--border)}
#log{display:flex;flex-direction:column;gap:4px}
.log-entry{opacity:0;animation:fadeIn .45s ease forwards;line-height:1.55;font-size:10.5px;padding:1px 0}
.log-entry.sys{color:var(--text-dim)}
.log-entry.lore{color:#a89060;font-style:italic}
.log-entry.danger{color:var(--red-bright)}
.log-entry.good{color:#60aa60}
.log-entry.imp{color:var(--amber-glow)}
.log-entry.combat{color:#e09050}
.log-entry.haunt{color:var(--purple);font-style:italic}
.log-entry.dark{color:#7040a0;font-style:italic}
.log-sep{border:none;border-top:1px solid var(--border);margin:5px 0;opacity:.3;width:100%}

/* MAIN — 78%: info col + actions col */
#main-panel{flex:1;margin-top:37px;display:flex;overflow:hidden}

/* INFO COL — fixed width, scrollable */
#info-col{flex:0 0 260px;overflow-y:auto;padding:8px 12px;border-right:1px solid var(--border)}

/* ACTIONS COL — fills remaining, scrollable */
#act-col{flex:1;overflow-y:auto;padding:8px 16px}

/* ── SHARED COMPONENTS ── */
.s-hdr{color:var(--amber-dim);font-size:9px;letter-spacing:3px;text-transform:uppercase;margin:12px 0 6px;border-bottom:1px solid var(--border);padding-bottom:2px}
.s-hdr:first-child{margin-top:4px}

/* stat bars */
.stat-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.stat-lbl{width:72px;font-size:10px;color:var(--text-dim)}
.stat-outer{flex:1;height:8px;background:rgba(255,255,255,.03);border:1px solid rgba(90,66,10,.4);overflow:hidden}
.stat-fill{height:100%;transition:width .35s ease}
.stat-fill.hp    {background:linear-gradient(90deg,#601010,#c02020)}
.stat-fill.hunger{background:linear-gradient(90deg,#6a3a10,#c06020)}
.stat-fill.thirst{background:linear-gradient(90deg,#102060,#2060c0)}
.stat-fill.sanity{background:linear-gradient(90deg,#3a1060,#8040c0)}
.stat-fill.rad   {background:linear-gradient(90deg,#204010,#60c020)}
.stat-fill.crit  {animation:pulse .8s infinite}
.stat-num{width:28px;text-align:right;font-size:10px;color:var(--text-dim)}

/* resources — single col */
.res-row{display:flex;justify-content:space-between;align-items:center;font-size:10px;padding:2px 0}
.res-name{color:var(--text-dim)}
.res-val{color:var(--text)}.res-val.z{color:var(--border)}.res-val.lo{color:var(--red-bright)}

/* equipment */
.eq-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:10px}
.eq-lbl{width:54px;color:var(--text-dim);flex-shrink:0}
.eq-val{flex:1;color:var(--amber-glow)}
.eq-empty{flex:1;color:var(--border)}
.eq-x{background:transparent;border:1px solid #5a1010;color:#7a3030;font-family:inherit;font-size:9px;cursor:pointer;padding:2px 6px;flex-shrink:0}
.eq-x:hover{border-color:var(--red-bright);color:var(--red-bright)}

/* inventory weapon rows */
.inv-weapon{display:flex;align-items:center;padding:3px 0;font-size:10px;gap:6px}
.inv-weapon .wname{flex:1;color:var(--text-dim)}
.inv-weapon .wcount{width:18px;text-align:right;color:var(--text)}
.inv-weapon .wcount.z{color:var(--border)}
.inv-weapon .weq{background:transparent;border:1px solid var(--amber-dim);color:var(--text-dim);font-family:inherit;font-size:9px;cursor:pointer;padding:2px 7px;flex-shrink:0;letter-spacing:.5px}
.inv-weapon .weq:hover{border-color:var(--amber);color:var(--amber-glow)}

/* base info */
#base-info{font-size:10px;color:var(--text-dim);line-height:1.9}

/* combat box — in info col */
#combat-box{display:none;background:rgba(100,0,0,.1);border:1px solid #5a1010;padding:10px;margin-bottom:8px}
#combat-box.on{display:block}
.ename{color:var(--red-bright);font-size:12px;letter-spacing:2px;margin-bottom:4px}
.ehp-outer{height:8px;background:rgba(255,255,255,.03);border:1px solid var(--red)}
.ehp-fill{height:100%;background:var(--red);transition:width .2s}

/* ── ACTION BUTTONS — big ── */
.act-btn{display:block;width:100%;padding:9px 14px;background:transparent;border:1px solid var(--amber-dim);color:var(--text);font-family:inherit;font-size:12px;letter-spacing:.4px;cursor:pointer;text-align:left;position:relative;overflow:hidden;transition:color .12s,border-color .12s,background .12s;margin-bottom:5px}
.act-btn:hover:not(:disabled){border-color:var(--amber);color:var(--amber-glow);background:rgba(200,150,12,.05)}
.act-btn:disabled{color:var(--text-dim);border-color:var(--border);cursor:default}
.act-btn.red{border-color:#5a1010}
.act-btn.red:hover:not(:disabled){border-color:var(--red-bright);color:var(--red-bright);background:rgba(200,40,40,.05)}
.act-btn.special{border-color:#3a1060;color:#7030b0;animation:pulse 2.5s infinite}
.act-btn.special:hover:not(:disabled){border-color:#8040c0;color:#b060f0}
.act-btn .cost{float:right;font-size:10px;color:var(--text-dim);opacity:.8}
.act-btn .sub{display:block;font-size:9px;color:var(--text-dim);margin-top:2px;letter-spacing:0}
.cd-bar{position:absolute;bottom:0;left:0;height:2px;background:var(--amber);width:0%}

/* section subheader inside actions */
.act-section{color:var(--amber-dim);font-size:9px;letter-spacing:3px;text-transform:uppercase;margin:14px 0 6px;border-bottom:1px solid var(--border);padding-bottom:2px}
.act-section:first-child{margin-top:2px}

/* modal */
#modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg2);border:1px solid var(--amber-dim);padding:24px;max-width:480px;width:90vw;z-index:500;animation:modalIn .2s ease}
#modal .mtitle{color:var(--amber-glow);letter-spacing:2px;margin-bottom:10px;font-size:11px}
#modal .mbody{color:#a89060;line-height:1.8;font-style:italic;margin-bottom:16px;white-space:pre-wrap;font-size:11px}
#modal .mclose{background:transparent;border:1px solid var(--amber-dim);color:var(--text);padding:6px 16px;font-family:inherit;cursor:pointer;font-size:11px;letter-spacing:1px}

/* end screen */
#end-screen{display:none;position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:600;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:40px}
#end-screen.on{display:flex}
#end-title{font-size:22px;letter-spacing:8px;color:var(--amber-glow);margin-bottom:18px;text-shadow:0 0 20px var(--amber)}
#end-body{max-width:520px;color:#a89060;line-height:1.9;font-style:italic;margin-bottom:28px;white-space:pre-wrap;font-size:12px}
#end-restart{background:transparent;border:1px solid var(--amber);color:var(--amber);padding:10px 30px;font-family:inherit;font-size:12px;letter-spacing:3px;cursor:pointer}
#end-restart:hover{background:rgba(200,150,12,.08)}

#night-veil{position:fixed;inset:0;background:transparent;pointer-events:none;transition:background 8s;z-index:10}
#night-veil.on{background:rgba(0,0,8,.4)}

@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes flicker{0%,95%,100%{opacity:1}96%{opacity:.6}97.5%{opacity:1}98.5%{opacity:.4}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--amber-dim)}
</style>
</head>
<body>
<div id="night-veil"></div>
<div id="game">
  <div id="header">
    <div id="title">◈ SHELTER 13 ◈</div>
    <div id="hud-r"><div id="time-line">DAY 1 · MORNING</div><div id="sp-line">PER 5</div></div>
  </div>

  <!-- LOG (22%) -->
  <div id="log-panel"><div id="log"></div></div>

  <!-- MAIN (78%) -->
  <div id="main-panel">

    <!-- INFO COL: stats, resources, equip, inventory, base -->
    <div id="info-col">
      <div id="combat-box">
        <div class="ename" id="ename">ENEMY</div>
        <div style="font-size:9px;color:var(--text-dim);margin-bottom:3px">HEALTH</div>
        <div class="ehp-outer"><div class="ehp-fill" id="ehp" style="width:100%"></div></div>
      </div>
      <div class="s-hdr">VITALS</div>
      <div class="stat-row"><div class="stat-lbl">HP</div><div class="stat-outer"><div class="stat-fill hp" id="bHP"></div></div><div class="stat-num" id="vHP">100</div></div>
      <div class="stat-row"><div class="stat-lbl">HUNGER</div><div class="stat-outer"><div class="stat-fill hunger" id="bHU"></div></div><div class="stat-num" id="vHU">75</div></div>
      <div class="stat-row"><div class="stat-lbl">THIRST</div><div class="stat-outer"><div class="stat-fill thirst" id="bTH"></div></div><div class="stat-num" id="vTH">75</div></div>
      <div class="stat-row"><div class="stat-lbl">SANITY</div><div class="stat-outer"><div class="stat-fill sanity" id="bSA"></div></div><div class="stat-num" id="vSA">100</div></div>
      <div class="stat-row"><div class="stat-lbl">RADIATION</div><div class="stat-outer"><div class="stat-fill rad" id="bRA"></div></div><div class="stat-num" id="vRA">0</div></div>
      <div class="s-hdr">RESOURCES</div>
      <div id="res-display"></div>
      <div class="s-hdr">EQUIPMENT</div>
      <div id="equip-display"></div>
      <div class="s-hdr">INVENTORY</div>
      <div id="inv-display"></div>
      <div class="s-hdr">BASE</div>
      <div id="base-info"></div>
    </div>

    <!-- ACTIONS COL -->
    <div id="act-col">
      <div id="actions"></div>
    </div>

  </div><!-- /main-panel -->
</div><!-- /game -->

<div id="modal">
  <div class="mtitle" id="modal-title">RECOVERED</div>
  <div class="mbody" id="modal-body"></div>
  <button class="mclose" id="modal-close">[ CLOSE ]</button>
</div>
<div id="end-screen">
  <div id="end-title">DEAD</div>
  <div id="end-body"></div>
  <button id="end-restart">[ NEW RUN ]</button>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════

const WEAPON_DEFS = {
  knife:     { name:'Knife',         dmg:[9,17],  hands:1, desc:'1H · fast and quiet' },
  machete:   { name:'Machete',       dmg:[13,23], hands:1, desc:'1H · solid reach' },
  pipeRifle: { name:'Pipe Rifle',    dmg:[22,36], hands:2, desc:'2H · keep distance' },
  shotgun:   { name:'Pipe Shotgun',  dmg:[28,46], hands:2, desc:'2H · brutal, close range' },
};

const TIME_LABELS = ['MIDNIGHT','MIDNIGHT','MIDNIGHT','MIDNIGHT','MIDNIGHT','DAWN','DAWN','DAWN','MORNING','MORNING','MORNING','MORNING','NOON','NOON','AFTERNOON','AFTERNOON','AFTERNOON','EVENING','EVENING','DUSK','DUSK','NIGHT','NIGHT','NIGHT'];

const LORE_DB = [
  { id:'L01', title:'HOLOTAPE — Personal Log, Entry 1',
    body:`Day 1 inside. I convinced twenty-three people to come with me. They thought I was paranoid.\n\nThe bombs fell this morning.\n\nI was right. I wish I wasn't.\n\n— D. Reyes, Shelter 13 Overseer` },
  { id:'L02', title:'HOLOTAPE — Personal Log, Entry 89',
    body:`Three people dead in the first week. Martinez went first — the sealed shelter finished what was left.\n\nWater rations: 200ml. The purifier is "almost fixed." It has been almost fixed for two months.\n\n— D. Reyes` },
  { id:'L03', title:'SCRAWLED NOTE — near the generator',
    body:`Someone stole my socks. IN THE APOCALYPSE.\n\nAlso: Devers says the purifier is almost fixed.\n\n(It is not almost fixed. We are all living in the "almost fixed" of things.)` },
  { id:'L04', title:'MEDICAL LOG — Dr. Abiodun Chen',
    body:`Subject exhibits dermal necrosis, loss of pigmentation, heightened aggression, and what I can only describe as luminescence.\n\nThe old books had a word for it.\n\nI administered our last anti-rad dose to myself. I'm a doctor. It was a medical decision.` },
  { id:'L05', title:'HOLOTAPE — Day 1826',
    body:`Five years. Twelve of us remain.\n\nWe've been sending scouts to the surface. Readings drop in the north sector.\n\nThe scouts haven't come back.\n\nWe've stopped sending scouts.` },
  { id:'L06', title:'HOLOTAPE — Emergency Broadcast',
    body:`If you find this — we left. Six of us. Heading north.\n\nSupplies in lower storage. Code: 1-3-1-3.\n\nIf you're a survivor: Shelter 13 is yours now. Build something.\n\n— Last of Shelter 13` },
  { id:'L07', title:'NOTE — scratched into concrete',
    body:`SOMETHING LIVES IN THE EAST CORRIDOR AFTER DARK.\n\nI'm serious.\n\nI AM EXTREMELY SERIOUS.\n\n(The handwriting gets shakier toward the end.)` },
  { id:'L08', title:'FRAGMENT — torn from a hand-drawn map',
    body:`The northern settlement — people say it's real. Past the Ashfields, beyond the Dead River.\n\nCarla spoke to someone who CAME from there. Who walked all the way south just to tell people it exists.\n\nMaybe.` },
  { id:'L09', title:'HOLOTAPE — "Dream Recording," unknown date',
    body:`I keep dreaming of the shelter full of people. Arguing over rations. Martinez doing bad impressions.\n\nWhat if someone stayed? What if someone turned this into something real?\n\nJust a dream. But sometimes a dream is an instruction.` },
  { id:'L10', title:'NOTE — written in something that isn\'t ink',
    body:`I've spoken to the thing in the east corridor.\n\nIt said: the waste takes everything. Why fight it? Become the wasteland.\n\nI declined. I'm writing this note, not becoming a creature of ancient dark.\n\nI thought about it, though.` },
];

const ENEMIES = {
  raider:  { name:'RAIDER',       maxHp:35,  atk:[5,12],  loot:{caps:[8,24],scrap:[3,7],food:[2,5],dirtyWater:[1,3]},           rad:0,  msg:"raider down." },
  ghoul:   { name:'FERAL GHOUL',  maxHp:28,  atk:[4,10],  loot:{scrap:[2,6],caps:[5,14],food:[1,3]},                            rad:5,  msg:"the ghoul collapses." },
  glowing: { name:'GLOWING ONE',  maxHp:50,  atk:[8,16],  loot:{medicine:[2,4],caps:[14,28],radAway:[0,1],scrap:[2,5]},         rad:16, msg:"the glowing one dims." },
  mutant:  { name:'SUPER MUTANT', maxHp:90,  atk:[14,24], loot:{scrap:[5,12],caps:[16,36],food:[3,7],medicine:[1,3],fuel:[1,3]},rad:0,  msg:"the mutant hits the floor like a building." },
  robot:   { name:'PROTECTRON',   maxHp:60,  atk:[10,18], loot:{scrap:[7,16],fuel:[3,7],caps:[10,22]},                          rad:0,  msg:"the robot goes dark." },
  raidBoss:{ name:'RAID BOSS',    maxHp:110, atk:[18,28], loot:{caps:[30,60],scrap:[6,14],medicine:[3,7],fuel:[3,7],food:[3,7]},rad:0,  msg:"the raid boss is dead." },
};

const ZONES = {
  ruins: { name:'NEARBY RUINS',    tickDur:40,  events:3, risk:.18, loot:'ruins',  hungerCost:4,  thirstCost:6  },
  town:  { name:'DEAD TOWN',       tickDur:70,  events:4, risk:.30, loot:'town',   hungerCost:8,  thirstCost:12 },
  bunker:{ name:'MILITARY BUNKER', tickDur:100, events:5, risk:.52, loot:'bunker', hungerCost:14, thirstCost:18 },
};

const HALLUCINATIONS = [
  'something moves in your peripheral vision. when you look: nothing.',
  'you hear your name. nobody knows your name.',
  'the walls are closer than before. you measure them. you are not certain.',
  'a radio plays in a room with no radio. almost familiar.',
  'you find a photograph in your pocket. three smiling people. one might be you.',
  'the shadow on the east wall waves at you. you wave back.',
  'you have been humming for six hours. you don\'t know this song.',
  'the water tastes like rust and old apologies.',
  'you wake and the fire has been tended. nobody tended the fire.',
];

const DARK_VOICES = [
  'the dark says: you are already what you are becoming.',
  '"stay. the waste keeps everyone, eventually."',
  'the dark says: everyone who left is gone. you are what remains.',
  '"stop fighting it. the wasteland always wins."',
];

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════

let G, TICK_ID;
const CD = {};

function freshState(){
  return {
    hp:100, maxHp:100,
    hunger:75, thirst:75, sanity:100, radiation:0,
    res:{ food:4, dirtyWater:3, cleanWater:0, scrap:6, medicine:1, fuel:0, caps:10 },
    inv:{ knife:0, machete:0, pipeRifle:0, shotgun:0, molotov:0, stimpak:0, radAway:0 },
    dmgBuff:0,
    equipped:{ hand1:null, hand2:null },
    base:{ fire:false, generator:false, purifier:false, bench:false, storage:0, defenses:0 },
    day:1, hour:8, ticks:0,
    phase:'shelter',
    exp:null,
    foe:null, prevPhase:'shelter',
    luck:ri(4,7), per:ri(4,7),
    flags:{ vehicleFound:false, strangerMet:false, strangerHelped:false, settlersHere:false,
            darkListened:0, darkOffered:false, showEscape:false, showRebuild:false },
    lore:[], choices:{ threat:0, help:0, dark:0 },
    nextRaid:ri(500,900), nextHalluc:ri(60,120),
    resCap:20,
  };
}

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function capRes(k){ G.res[k]=clamp(G.res[k]||0,0,G.resCap); }
function addRes(k,n){ G.res[k]=Math.min(G.resCap,(G.res[k]||0)+n); }
function changeLuck(delta, reason){
  const prev=G.luck;
  G.luck=clamp(G.luck+delta,1,10);
  if(G.luck!==prev){
    // Subtle hint without revealing the number
    if(delta>0) log(`something feels slightly more favorable.`,'sys');
    else log(`something feels slightly off.`,'sys');
  }
}

// ═══════════════════════════════════════════════════════════
// LOG
// ═══════════════════════════════════════════════════════════

function log(text,cls=''){
  const el=document.createElement('div');
  el.className='log-entry'+(cls?' '+cls:'');
  el.textContent=text;
  const L=document.getElementById('log');
  L.prepend(el);
  document.getElementById('log-panel').scrollTop=0;
  while(L.children.length>180) L.removeChild(L.lastChild);
}
function logSep(){
  const hr=document.createElement('hr'); hr.className='log-sep';
  document.getElementById('log').prepend(hr);
}

// ═══════════════════════════════════════════════════════════
// BUTTON FACTORY
// ═══════════════════════════════════════════════════════════

function makeBtn(parent, id, label, opts={}){
  const b=document.createElement('button');
  b.className='act-btn'+(opts.cls?' '+opts.cls:'');
  let html=label;
  if(opts.cost) html+=` <span class="cost">${opts.cost}</span>`;
  if(opts.sub)  html+=`<span class="sub">${opts.sub}</span>`;
  b.innerHTML=html;

  const bar=document.createElement('div'); bar.className='cd-bar'; bar.style.width='0%';
  b.appendChild(bar);

  const now=Date.now(), exp=CD[id], dur=CD[id+'_d'];
  if(exp&&exp>now){
    b.disabled=true;
    const rem=exp-now;
    bar.style.width=(rem/(dur||rem)*100)+'%';
    requestAnimationFrame(()=>{ bar.style.transition=`width ${rem}ms linear`; bar.style.width='0%'; });
  } else if(opts.disabled){
    b.disabled=true;
  }

  b.addEventListener('click',()=>{
    if(b.disabled) return;
    const n=Date.now();
    if(CD[id]&&CD[id]>n) return;
    opts.action();
    if(opts.cd){
      CD[id]=n+opts.cd; CD[id+'_d']=opts.cd;
      b.disabled=true;
      bar.style.transition='none'; bar.style.width='100%';
      requestAnimationFrame(()=>{ bar.style.transition=`width ${opts.cd}ms linear`; bar.style.width='0%'; });
      setTimeout(()=>{ delete CD[id]; delete CD[id+'_d']; updateStats(); }, opts.cd);
    }
    updateStats();
  });

  parent.appendChild(b); return b;
}

function actSec(parent,label){
  const d=document.createElement('div'); d.className='act-section'; d.textContent=label;
  parent.appendChild(d);
}

// ═══════════════════════════════════════════════════════════
// EQUIP SYSTEM
// ═══════════════════════════════════════════════════════════

function equipWeapon(key){
  const def=WEAPON_DEFS[key];
  if(!def){ log('unknown weapon.','danger'); return; }
  if((G.inv[key]||0)<1){ log('you don\'t have that.','danger'); return; }
  if(def.hands===2){
    if(G.equipped.hand1!==null||G.equipped.hand2!==null){
      log('unequip your current weapons first.','danger'); return;
    }
    G.equipped.hand1=key; G.equipped.hand2=key;
    log(`equipped ${def.name} (both hands).`,'good');
  } else {
    // Check if both slots are occupied by a 2H weapon
    if(G.equipped.hand1!==null&&WEAPON_DEFS[G.equipped.hand1]?.hands===2){
      log('unequip your 2-handed weapon first.','danger'); return;
    }
    if(G.equipped.hand1===null){ G.equipped.hand1=key; log(`equipped ${def.name} in left hand.`,'good'); }
    else if(G.equipped.hand2===null){ G.equipped.hand2=key; log(`equipped ${def.name} in right hand.`,'good'); }
    else{ log('both hands full — unequip something first.','danger'); return; }
  }
}

function unequipSlot(slot){
  const key=G.equipped[slot]; if(!key) return;
  const def=WEAPON_DEFS[key];
  if(def.hands===2){ G.equipped.hand1=null; G.equipped.hand2=null; }
  else { G.equipped[slot]=null; }
  log(`unequipped ${def.name}.`,'sys');
}

function getAttackDmg(){
  const h1=G.equipped.hand1, h2=G.equipped.hand2;
  let mn,mx;
  if(!h1&&!h2){ mn=2; mx=7; }
  else if(h1&&h1===h2){ const d=WEAPON_DEFS[h1].dmg; mn=d[0]; mx=d[1]; }
  else {
    mn=2; mx=7; let added=false;
    if(h1&&WEAPON_DEFS[h1]){ const d=WEAPON_DEFS[h1].dmg; if(!added){mn=d[0];mx=d[1];added=true;} }
    if(h2&&h2!==h1&&WEAPON_DEFS[h2]){ const d=WEAPON_DEFS[h2].dmg; mn+=Math.round(d[0]*.6); mx+=Math.round(d[1]*.6); }
  }
  mn+=G.dmgBuff||0; mx+=G.dmgBuff||0;
  return [mn,mx];
}

function getAttackLabel(){
  const h1=G.equipped.hand1, h2=G.equipped.hand2;
  if(!h1&&!h2) return 'Strike (Fists)';
  if(h1&&h1===h2) return `Attack — ${WEAPON_DEFS[h1].name}`;
  const parts=[]; if(h1)parts.push(WEAPON_DEFS[h1].name); if(h2&&h2!==h1)parts.push(WEAPON_DEFS[h2].name);
  return `Attack — ${parts.join(' + ')}`;
}

function setBar(id,val,max){
  const pct=clamp((val/max)*100,0,100);
  const b=document.getElementById('b'+id), v=document.getElementById('v'+id);
  if(b){ b.style.width=pct+'%'; pct<20?b.classList.add('crit'):b.classList.remove('crit'); }
  if(v) v.textContent=Math.floor(val);
}

function updateStats(){
  // Bars
  setBar('HP',G.hp,G.maxHp); setBar('HU',G.hunger,100);
  setBar('TH',G.thirst,100); setBar('SA',G.sanity,100); setBar('RA',G.radiation,100);

  // Resources (single col)
  const RN={food:'Food',dirtyWater:'Dirty Water',cleanWater:'Clean Water',scrap:'Scrap',medicine:'Medicine',fuel:'Fuel',caps:'Caps'};
  const rd=document.getElementById('res-display'); rd.innerHTML='';
  for(const[k,n] of Object.entries(RN)){
    const v=G.res[k]||0;
    const lo=(k==='food'&&v<2)||(k==='dirtyWater'&&v<1&&!G.base.purifier);
    rd.innerHTML+=`<div class="res-row"><span class="res-name">${n}</span><span class="res-val${v===0?' z':lo?' lo':''}">${v}</span></div>`;
  }

  // Equipment
  const ed=document.getElementById('equip-display'); ed.innerHTML='';
  const shown=new Set();
  const anyEquipped=G.equipped.hand1!==null||G.equipped.hand2!==null;
  [['hand1','L.HAND'],['hand2','R.HAND']].forEach(([slot,lbl])=>{
    const key=G.equipped[slot];
    if(!key&&!anyEquipped) return; // hide both empty rows if nothing equipped
    const row=document.createElement('div'); row.className='eq-row';
    if(key){
      const def=WEAPON_DEFS[key], isShown=shown.has(key);
      row.innerHTML=`<span class="eq-lbl">${lbl}</span><span class="eq-val">${isShown?'╰ ':''} ${def.name}</span>`;
      shown.add(key);
      if(G.phase==='shelter'&&!isShown){
        const x=document.createElement('button'); x.className='eq-x'; x.textContent='UNEQUIP';
        x.addEventListener('click',()=>{ unequipSlot(slot); updateStats(); });
        row.appendChild(x);
      }
    } else {
      row.innerHTML=`<span class="eq-lbl">${lbl}</span><span class="eq-empty">— empty —</span>`;
    }
    ed.appendChild(row);
  });
  if(!anyEquipped){ ed.innerHTML='<div class="res-row"><span class="res-name" style="color:var(--border)">— unarmed —</span></div>'; }

  // Inventory — weapons as full rows with EQUIP button
  const id2=document.getElementById('inv-display'); id2.innerHTML='';
  const weaponKeys=Object.keys(WEAPON_DEFS);

  // Weapons — only show if owned or equipped
  for(const k of weaponKeys){
    const def=WEAPON_DEFS[k], v=G.inv[k]||0;
    const isEq=G.equipped.hand1===k||G.equipped.hand2===k;
    if(v===0&&!isEq) continue; // hide ghost items
    const row=document.createElement('div'); row.className='inv-weapon';
    row.innerHTML=`<span class="wname">${def.name}${isEq?' ✦':''}</span><span class="wcount${v===0?' z':''}">${v}</span>`;
    if(v>0&&!isEq&&G.phase==='shelter'){
      const eb=document.createElement('button'); eb.className='weq'; eb.textContent='EQUIP';
      eb.addEventListener('click',()=>{ equipWeapon(k); updateStats(); });
      row.appendChild(eb);
    }
    id2.appendChild(row);
  }
  // Consumables — only show if owned
  const consumes={molotov:'Molotov',stimpak:'Stimpak',radAway:'Rad-Away'};
  for(const[k,n] of Object.entries(consumes)){
    const v=G.inv[k]||0;
    if(v===0) continue;
    id2.innerHTML+=`<div class="res-row"><span class="res-name">${n}</span><span class="res-val">${v}</span></div>`;
  }
  if(id2.innerHTML===''){ id2.innerHTML='<div class="res-row"><span class="res-name" style="color:var(--border)">— nothing —</span></div>'; }

  // Base
  const bi=document.getElementById('base-info');
  const parts=[];
  if(G.base.generator)parts.push('⚡ Generator'); else if(G.base.fire)parts.push('🔥 Fire');
  if(G.base.purifier)parts.push('💧 Purifier');
  if(G.base.bench)parts.push('🔧 Workbench');
  if(G.base.storage>0)parts.push(`📦 Storage Lv${G.base.storage}`);
  if(G.base.defenses>0)parts.push(`🛡 Defenses Lv${G.base.defenses}`);
  bi.innerHTML=parts.length?parts.join('<br>'):'<span style="color:var(--border)">bare concrete</span>';

  // HUD
  document.getElementById('time-line').textContent=`DAY ${G.day} · ${TIME_LABELS[G.hour]||'NIGHT'}`;
  document.getElementById('sp-line').textContent=`PER ${G.per}`;
  document.getElementById('night-veil').className=(G.hour<6||G.hour>=20)?'on':'';

  // Combat box
  if(G.phase==='combat'&&G.foe){
    document.getElementById('combat-box').className='on';
    document.getElementById('ename').textContent=G.foe.name;
    document.getElementById('ehp').style.width=Math.max(0,(G.foe.hp/G.foe.maxHp)*100)+'%';
  } else {
    document.getElementById('combat-box').className='';
  }

  renderActions();
}

function doBuild(name){
  const costs={fire:{scrap:3},generator:{scrap:8,fuel:2},purifier:{scrap:6},bench:{scrap:5},
                storage:{scrap:4+G.base.storage*2},defenses:{scrap:5+G.base.defenses*3}};
  const c=costs[name];
  for(const[k,v]of Object.entries(c)){if((G.res[k]||0)<v){log(`not enough ${k}.`,'danger');return;}}
  for(const[k,v]of Object.entries(c)) G.res[k]-=v;
  const msgs={fire:'a fire. the light is small. it is enough.',generator:'the generator coughs to life. electricity.',
    purifier:'the water purifier hums.',bench:'a workbench. crafting unlocked.',
    storage:'storage expanded.',defenses:'defenses reinforced.'};
  if(name==='fire')G.base.fire=true;
  else if(name==='generator'){G.base.generator=true;G.base.fire=true;}
  else if(name==='purifier')G.base.purifier=true;
  else if(name==='bench')G.base.bench=true;
  else if(name==='storage'){G.base.storage++;G.resCap=20+G.base.storage*10;}
  else if(name==='defenses')G.base.defenses++;
  log(msgs[name],'good'); checkEndings();
}

function doScavenge(){
  const roll=Math.random()+(G.per-5)*.04;
  const found=[];
  if(roll>.28){const n=ri(1,3);addRes('food',n);found.push(`${n} food`);}
  if(roll>.38){const n=ri(1,3);addRes('dirtyWater',n);found.push(`${n} dirty water`);}
  if(roll>.45){const n=ri(1,4);addRes('scrap',n);found.push(`${n} scrap`);}
  if(roll>.65&&Math.random()>.45){addRes('medicine',1);found.push('1 medicine');}
  if(roll>.75&&Math.random()>.5){const c=ri(4,10);G.res.caps+=c;found.push(`${c} caps`);}
  G.sanity=clamp(G.sanity-1.5,0,100);
  if(found.length)log(`shelter search: ${found.join(', ')}.`,'good');
  else log('you search. the shelter has given everything it has.','sys');
  if(Math.random()>.6)tryRevealLore(['L01','L02','L03','L04','L07']);
}

function startExp(zone){
  const z=ZONES[zone];
  G.exp={zone, depth:0};
  G.phase='expedition';
  logSep();
  log(`you leave the shelter. the wasteland exhales.`,'imp');
  log(`→ ${z.name}. press "Continue Exploring" to push deeper.`,'sys');
}

function doExpStep(){
  if(!G.exp||G.phase==='dead'||G.phase==='ending') return;
  const zone=G.exp.zone;
  G.exp.depth++;
  const depth=G.exp.depth;

  // Passive cost per step — scales with depth and zone
  const hpCost={ruins:ri(3,6),town:ri(5,9),bunker:ri(8,14)}[zone];
  const radGain={ruins:ri(2,6),town:ri(4,9),bunker:ri(10,18)}[zone];
  const hungerCost={ruins:1,town:2,bunker:3}[zone];
  const thirstCost={ruins:2,town:3,bunker:4}[zone];

  G.hp=Math.max(1,G.hp-hpCost);
  G.radiation=clamp(G.radiation+radGain,0,100);
  G.hunger=clamp(G.hunger-hungerCost,0,100);
  G.thirst=clamp(G.thirst-thirstCost,0,100);
  G.sanity=clamp(G.sanity-ri(1,3),0,100);

  log(`depth ${depth} — -${hpCost} hp, +${radGain} rad.`,'danger');

  runExpEvt(zone);
}

function returnExp(emergency){
  if(!G.exp) return;
  G.exp=null; G.phase='shelter';
  logSep();
  if(!emergency) log('you head back. the shelter door closes behind you.','sys');
  checkEndings(); updateStats();
}

function runExpEvt(zone){
  // Always loot something
  const evts={
    ruins:[
      ()=>{ const f=ri(3,6),s=ri(3,8),c=ri(3,12); addRes('food',f);addRes('scrap',s);G.res.caps+=c; log(`collapsed home — ${f} food, ${s} scrap, ${c} caps.`,'good'); },
      ()=>{ const w=ri(2,5); addRes('dirtyWater',w); log(`cracked water jugs. (+${w} dirty water)`,'good'); },
      ()=>{ const c=ri(8,20); G.res.caps+=c; log(`scattered caps. (+${c} caps)`,'good'); },
      ()=>{ const m=ri(1,3); addRes('medicine',m); log(`medicine cabinet — not empty. (+${m} medicine)`,'good'); },
      ()=>{ const f=ri(1,3),s=ri(2,5); addRes('fuel',f);addRes('scrap',s); log(`utility closet — ${f} fuel, ${s} scrap.`,'good'); },
      ()=>{ const f=ri(2,4),w=ri(1,3); addRes('food',f);addRes('dirtyWater',w); log(`dwelling kitchen — ${f} food, ${w} dirty water.`,'good'); },
    ],
    town:[
      ()=>{ const f=ri(4,9),s=ri(4,10),c=ri(12,30); addRes('food',f);addRes('scrap',s);G.res.caps+=c; log(`general store — ${f} food, ${s} scrap, ${c} caps.`,'good'); },
      ()=>{ const fu=ri(2,5); addRes('fuel',fu); log(`gas station back room. (+${fu} fuel)`,'good'); },
      ()=>{ G.sanity=clamp(G.sanity+15,0,100); log('a radio, somehow working. one pre-war song. (+15 sanity)','good'); },
      ()=>{ tryRevealVehicle(); },
      ()=>{ tryMeetStranger(); },
      ()=>{ const m=ri(2,5); addRes('medicine',m); log(`clinic — mostly ransacked, not empty. (+${m} medicine)`,'good'); },
      ()=>{ const f=ri(2,5),w=ri(2,4),c=ri(8,22); addRes('food',f);addRes('dirtyWater',w);G.res.caps+=c; log(`apartment block — ${f} food, ${w} dirty water, ${c} caps.`,'good'); },
      ()=>{ const s=ri(3,7),fu=ri(1,4),c=ri(10,25); addRes('scrap',s);addRes('fuel',fu);G.res.caps+=c; log(`hardware store — ${s} scrap, ${fu} fuel, ${c} caps.`,'good'); },
    ],
    bunker:[
      ()=>{ const s=ri(8,16),fu=ri(3,7); addRes('scrap',s);addRes('fuel',fu); log(`military locker — ${s} scrap, ${fu} fuel.`,'good'); },
      ()=>{ const m=ri(3,7); addRes('medicine',m); log(`military medkits. (+${m} medicine)`,'good'); },
      ()=>{ const c=ri(30,70); G.res.caps+=c; log(`paymaster's lockbox. (+${c} caps)`,'good'); },
      ()=>{ const s=ri(5,12),fu=ri(2,6),c=ri(15,40); addRes('scrap',s);addRes('fuel',fu);G.res.caps+=c; log(`armory — ${s} scrap, ${fu} fuel, ${c} caps.`,'good'); },
      ()=>{ const m=ri(2,5),s=ri(4,10); addRes('medicine',m);addRes('scrap',s); log(`research lab — ${m} medicine, ${s} scrap.`,'good'); },
      ()=>{ const fu=ri(3,8),c=ri(20,50); addRes('fuel',fu);G.res.caps+=c; log(`vehicle bay — ${fu} fuel, ${c} caps.`,'good'); },
    ],
  };
  const pool=evts[zone]; pool[ri(0,pool.length-1)]();

  // Lore occasionally
  if(Math.random()>.65){
    const lorePools={ruins:['L01','L02','L07'],town:['L02','L05','L06','L08'],bunker:['L05','L06','L08','L09','L10']};
    tryRevealLore(lorePools[zone]);
  }

  // Combat roll — independent, after loot
  const risk=clamp(ZONES[zone].risk+(G.exp?.depth||1)*0.04-(G.luck-5)*0.04,0.05,0.85);
  if(Math.random()<risk){
    const pools={ruins:['raider','ghoul'],town:['raider','ghoul','glowing','mutant'],bunker:['glowing','mutant','robot']};
    const pool2=pools[zone]; const eid=pool2[ri(0,pool2.length-1)];
    const e=ENEMIES[eid];
    log(`movement in the dark.`,'danger');
    startCombat({...e,hp:e.maxHp});
  }

  updateStats();
}

function tryRevealVehicle(){
  if(!G.flags.vehicleFound){
    G.flags.vehicleFound=true;
    log('a vehicle. battered. possibly functional.','imp');
    log('with fuel and caps, you could leave. head north.','lore');
    tryRevealLore(['L08']);
  } else {
    const fu=ri(2,4); addRes('fuel',fu); log(`vehicle bay — still useful. (+${fu} fuel)`,'good');
  }
}

function tryMeetStranger(){
  if(G.flags.strangerMet||G.flags.settlersHere) return;
  G.flags.strangerMet=true;
  log('a figure in the road. hands raised.','imp');
  log('"we\'re not a threat." exactly what a threat says. they mention a group.','lore');
  showStrangerChoice();
}

function showStrangerChoice(){
  G.phase='choice';
  const A=document.getElementById('actions'); A.innerHTML='';
  actSec(A,'A STRANGER');
  const p=document.createElement('div');
  p.style.cssText='font-size:11px;color:var(--text-dim);padding:6px 0 10px;line-height:1.7';
  p.textContent='"six of us. we have skills. we can help rebuild this shelter — or we can keep walking."';
  A.appendChild(p);
  [
    {l:'Welcome them inside', fn(){
      G.flags.strangerHelped=true;G.flags.settlersHere=true;G.choices.help++;
      addRes('food',6);addRes('medicine',3);G.sanity=clamp(G.sanity+15,0,100);
      changeLuck(1);
      log('you step aside. six people file in.','good');log('settlers arrive at shelter 13.','imp');
      tryRevealLore(['L09']);resumeAfterChoice();}},
    {l:'Turn them away', fn(){
      G.sanity=clamp(G.sanity-5,0,100);log('you shake your head. they leave.','sys');
      log('the shelter feels emptier.','lore');resumeAfterChoice();}},
    {l:'Drive them off',cls:'red',fn(){
      G.choices.threat++;changeLuck(-1);
      log('you raise whatever you have. they scatter.','danger');
      addRes('food',2);tryRevealLore(['L10']);resumeAfterChoice();}},
  ].forEach(c=>{
    const b=document.createElement('button');b.className='act-btn'+(c.cls?' '+c.cls:'');b.textContent=c.l;
    b.addEventListener('click',()=>{c.fn();updateStats();});A.appendChild(b);
  });
}

function resumeAfterChoice(){ G.phase=G.exp?'expedition':'shelter'; checkEndings(); }

// ═══════════════════════════════════════════════════════════
// COMBAT
// ═══════════════════════════════════════════════════════════

function startCombat(enemy){
  G.prevPhase=G.phase; G.phase='combat'; G.foe={...enemy};
  logSep(); log(`⚠ ${enemy.name}`,'danger'); log(enemy.desc||'','lore'); updateStats();
}

function playerAttack(){
  if(!G.foe) return;
  let [mn,mx]=getAttackDmg();
  let dmg=ri(mn,mx); dmg=Math.round(dmg*(1+(G.luck-5)*.05));
  G.foe.hp=Math.max(0,G.foe.hp-dmg);
  const verbs=['you hit','you connect','you strike','you land a blow'];
  log(`${verbs[ri(0,verbs.length-1)]}. ${G.foe.name} takes ${dmg} damage.`,'combat');
  if(G.foe.hp<=0){endCombat(true);return;}
  enemyTurn();
}

function enemyTurn(){
  if(!G.foe) return;
  let dmg=ri(G.foe.atk[0],G.foe.atk[1]);
  if(G.base.defenses>0&&G.prevPhase==='shelter') dmg=Math.floor(dmg*(1-G.base.defenses*.12));
  G.hp=clamp(G.hp-dmg,0,G.maxHp);
  if(G.foe.rad){G.radiation=clamp(G.radiation+G.foe.rad,0,100);log(`radiation. (+${G.foe.rad} rad)`,'danger');}
  const v=[`${G.foe.name} strikes back.`,`${G.foe.name} attacks.`,`${G.foe.name} retaliates.`];
  log(`${v[ri(0,v.length-1)]} -${dmg} hp`,'danger');
  if(G.hp<=0) die(`you fall to the ${G.foe.name.toLowerCase()}.`);
}

function endCombat(won){
  if(!G.foe) return;
  const foe=G.foe;
  if(won){
    log(foe.msg,'good');
    for(const[k,range]of Object.entries(foe.loot)){
      const amt=ri(range[0],range[1]); if(amt<=0) continue;
      if(k in G.res) addRes(k,amt); else if(k in G.inv) G.inv[k]+=amt;
    }
    G.sanity=clamp(G.sanity-8,0,100); log('killing takes something.','sys');
    changeLuck(1); // survived = slightly luckier
  }
  G.foe=null; G.dmgBuff=0; G.phase=G.exp?'expedition':'shelter'; updateStats();
}

// ═══════════════════════════════════════════════════════════
// THE DARK
// ═══════════════════════════════════════════════════════════

function doDarkAction(){
  G.flags.darkListened++; G.choices.dark++;
  changeLuck(-1);
  if(G.flags.darkListened===1){
    log('you press your ear to the east wall. something breathes.','dark');
    log('"you\'re still fighting. you don\'t have to."','dark');
  } else if(G.flags.darkListened===2){
    log('"the shelter is the wasteland. you are the wasteland."','dark');
    log('something loosens inside you. not entirely bad.','haunt');
  } else if(G.flags.darkListened>=3&&!G.flags.darkOffered){
    G.flags.darkOffered=true; showDarkChoice();
  }
}

function showDarkChoice(){
  G.phase='choice';
  const A=document.getElementById('actions'); A.innerHTML='';
  actSec(A,'THE OFFER');
  const p=document.createElement('div');
  p.style.cssText='font-size:11px;color:#4a2a6a;padding:6px 0 10px;line-height:1.8;font-style:italic';
  p.textContent='"stop being afraid. stop surviving. just become. the waste takes everything — why not choose it?"'; A.appendChild(p);
  [{l:'Refuse. Survive.',fn(){log('you pull back. the voice goes quiet.','good');changeLuck(2);G.sanity=clamp(G.sanity+20,0,100);log('+20 sanity.','good');G.phase='shelter';}},
   {l:'Accept. Become.',cls:'special',fn(){changeLuck(-3);doDarkEnd();}}
  ].forEach(c=>{
    const b=document.createElement('button');b.className='act-btn'+(c.cls?' '+c.cls:'');b.textContent=c.l;
    b.addEventListener('click',()=>{c.fn();updateStats();});A.appendChild(b);
  });
}

// ═══════════════════════════════════════════════════════════
// LORE
// ═══════════════════════════════════════════════════════════

function tryRevealLore(ids){
  const cs=ids.filter(id=>!G.lore.includes(id));
  if(!cs.length) return;
  const id=cs[ri(0,cs.length-1)];
  const lore=LORE_DB.find(l=>l.id===id); if(!lore) return;
  G.lore.push(id);
  setTimeout(()=>showModal(lore.title,lore.body),300);
}
function showModal(title,body){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').textContent=body;
  document.getElementById('modal').style.display='block';
}
document.getElementById('modal-close').addEventListener('click',()=>{document.getElementById('modal').style.display='none';});

// ═══════════════════════════════════════════════════════════
// TICK
// ═══════════════════════════════════════════════════════════

function tick(){
  if(G.phase==='dead'||G.phase==='ending') return;
  G.ticks++;

  // Time: 1 hour = 15 ticks
  if(G.ticks%15===0){
    G.hour++; if(G.hour>=24){G.hour=0;G.day++;dailyEvent();}
    updateStats();
  }

  // Stat decay every 5 ticks
  if(G.ticks%5===0){
    const night=G.hour<6||G.hour>=20, lit=G.base.fire||G.base.generator;
    G.hunger=clamp(G.hunger-1,0,100);
    G.thirst=clamp(G.thirst-1.5,0,100);
    let sd=0.35;
    if(night&&!lit)sd+=0.65;
    if(G.radiation>50)sd+=0.4;
    if(G.phase==='expedition')sd+=0.25;
    G.sanity=clamp(G.sanity-sd,0,100);

    if(G.hunger<=0){G.hp=clamp(G.hp-.8,0,G.maxHp);if(G.ticks%25===0)log('starvation.','danger');}
    if(G.thirst<=0){G.hp=clamp(G.hp-1.2,0,G.maxHp);if(G.ticks%20===0)log('dehydration.','danger');}

    // HP regen when well fed and hydrated — 1hp/s
    if(G.hunger>65&&G.thirst>65&&G.hp<G.maxHp) G.hp=Math.min(G.maxHp,G.hp+1);

    // Radiation cap
    G.maxHp=Math.max(15,100-Math.floor(G.radiation/3));
    if(G.hp>G.maxHp) G.hp=G.maxHp;

    // Rads overtake HP = death
    if(G.radiation>0&&G.hp<G.radiation){die('radiation poisoning overwhelms you. your cells lose the argument.');return;}
    if(G.hp<=0){const r=G.hunger<=0?'starvation':G.thirst<=0?'thirst':'wounds';die(`you die of ${r}.`);return;}

    // Warnings
    if(G.ticks%20===0){
      if(G.hunger<20)log('hunger gnaws.','danger');
      if(G.thirst<20)log('your throat is ash.','danger');
      if(G.sanity<25)log('the edges of things grow soft.','haunt');
      if(G.radiation>0&&G.radiation*.85>G.hp)log('⚠ radiation is closing in on your hp.','danger');
    }
    updateStats();
  }

  // Hallucinations
  if(G.sanity<40&&G.ticks>=G.nextHalluc){
    G.nextHalluc=G.ticks+ri(35,90);
    log(HALLUCINATIONS[ri(0,HALLUCINATIONS.length-1)],'haunt');
    if(G.sanity<15&&G.radiation>35)setTimeout(()=>log(DARK_VOICES[ri(0,DARK_VOICES.length-1)],'dark'),1600);
  }

  // Night raids
  if(G.ticks>=G.nextRaid&&G.phase==='shelter'&&(G.hour<5||G.hour>=21)){
    G.nextRaid=G.ticks+ri(500,1000); nightRaid();
  }

  // Passive purifier
  if(G.base.purifier&&G.ticks%80===0&&G.res.dirtyWater>0){
    G.res.dirtyWater--;addRes('cleanWater',1);log('purifier — one more clean water.','sys');
  }
}

function dailyEvent(){
  logSep();
  const evts=[
    ()=>log(`— day ${G.day} —`,'sys'),
    ()=>{G.res.dirtyWater=Math.min(G.resCap,G.res.dirtyWater+1);log(`day ${G.day}. light rain. containers catch it. (+1 dirty water)`,'good');},
    ()=>{G.sanity=clamp(G.sanity+6,0,100);log(`day ${G.day}. a decent night's sleep. (+6 sanity)`,'good');},
    ()=>{addRes('scrap',1);log(`day ${G.day}. a wall collapses nearby. salvageable. (+1 scrap)`,'good');},
    ()=>log(`day ${G.day}. distant gunfire. far enough.`,'sys'),
    ()=>log(`day ${G.day}. something large passed by in the night. didn't come in.`,'lore'),
    ()=>log(`day ${G.day}. quiet. you're not sure if quiet is good anymore.`,'sys'),
  ];
  evts[ri(0,evts.length-1)]();
  checkEndings();
}

function nightRaid(){
  logSep();
  log('sounds at the perimeter.','danger');
  const defMod=G.base.defenses*.25+(G.luck-5)*.05;
  if(Math.random()<defMod){log('your defenses hold. they leave.','good');changeLuck(1);return;}
  const eid=G.day>8?'raidBoss':'raider';
  startCombat({...ENEMIES[eid],hp:ENEMIES[eid].maxHp});
}

// ═══════════════════════════════════════════════════════════
// ENDINGS
// ═══════════════════════════════════════════════════════════

function checkEndings(){
  if(G.flags.vehicleFound&&G.res.fuel>=5&&G.res.caps>=20&&!G.flags.showEscape){
    G.flags.showEscape=true;log('you have everything needed to leave. the north waits.','imp');
  }
  if(G.flags.settlersHere&&G.base.defenses>=2&&G.base.storage>=2&&G.base.bench&&!G.flags.showRebuild){
    G.flags.showRebuild=true;log('shelter 13 is becoming something real.','imp');
  }
}

function doEscapeEnd(){
  if(G.res.fuel<5||G.res.caps<20)return;
  G.res.fuel-=5;G.res.caps-=20;G.phase='ending';clearInterval(TICK_ID);
  setTimeout(()=>showEnd('EXODUS',`You fix the vehicle. It takes three days and everything you have.\n\nThen it runs.\n\nYou drive north. The ashfields give way to grey soil, then to something you hesitantly call grass. The dosimeter drops for the first time in weeks.\n\nYou don't look back.\n\nThree weeks later: the northern settlement. Real. Small. Warm.\n\n"We didn't think anyone else was left," someone says.\n\nYou survived. That's the whole story. That's enough.\n\n─────────────────────────\nDAYS SURVIVED: ${G.day}\nPERCEPTION: ${G.per}\n─────────────────────────`),500);
}

function doRebuildEnd(){
  G.phase='ending';clearInterval(TICK_ID);
  setTimeout(()=>showEnd('HOME',`You hold a vote. Your first vote in Shelter 13.\n\nEveryone gets a say. The settlers are surprised. They weren't expecting democracy.\n\nThe shelter grows. More people come — word travels. Walls, a water system, a garden. An argument about the garden. Then a bigger garden.\n\nYou name it. Not Shelter 13. Something new.\n\nIt's not paradise. The wasteland doesn't do paradise. But it's warm, and it's yours, and people are laughing in it.\n\n─────────────────────────\nDAYS SURVIVED: ${G.day}\nPERCEPTION: ${G.per}\n─────────────────────────`),500);
}

function doDarkEnd(){
  G.phase='ending';clearInterval(TICK_ID);
  setTimeout(()=>showEnd('THE WASTE',`You stop fighting.\n\nIt's not dramatic. You just stop.\n\nThe thing from the east corridor comes through — or maybe it was never in the corridor.\n\nYou remain in Shelter 13.\n\nTravelers who pass find something there. They don't stay long. They don't come back. But they tell stories.\n\nThere's something in the old shelter, they say. Not dangerous. Not safe.\n\nA remnant. A thing that chose to be what the wasteland made.\n\nYou are what remains.\n\n─────────────────────────\nDAYS SURVIVED: ${G.day}\nENDING: THE DARK\n─────────────────────────`),500);
}

function die(reason){
  G.phase='dead';clearInterval(TICK_ID);
  log(`✗ ${reason}`,'danger'); updateStats();
  setTimeout(()=>showEnd('DEAD',`${reason}\n\nShelter 13 goes quiet. Whatever fire you built burns to nothing.\n\nThe wasteland reclaims what was always the wasteland's.\n\nSomewhere, a machine records the fact of your existence and then forgets it.\n\n─────────────────────────\nDAYS SURVIVED: ${G.day}\nPERCEPTION: ${G.per}\n─────────────────────────`),2000);
}

function showEnd(title,body){
  document.getElementById('end-title').textContent=title;
  document.getElementById('end-body').textContent=body;
  document.getElementById('end-screen').classList.add('on');
}

document.getElementById('end-restart').addEventListener('click',()=>{
  document.getElementById('end-screen').classList.remove('on');
  document.getElementById('log').innerHTML='';
  clearInterval(TICK_ID);Object.keys(CD).forEach(k=>delete CD[k]);
  init();
});

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════

function init(){
  G=freshState();
  const seq=[
    [200,'you wake up.','imp'],
    [900,'you don\'t remember falling asleep.','sys'],
    [1700,'concrete walls. rust. old air. a shelter.','lore'],
    [2600,'you don\'t remember coming here either.','sys'],
    [3400,'there are supplies. not many. enough to not die immediately.','sys'],
    [4200,'for now, that\'s the whole plan.','lore'],
    [5100,'—','sep'],
    [5400,`luck: ${0}, perception: ${0}. some things are decided before you wake up.`,'sys'],
    [6000,'gather what you can. the wasteland is patient.','sys'],
  ];
  seq.forEach(([t,txt,cls])=>{
    if(cls==='sep'){setTimeout(()=>logSep(),t);return;}
    if(txt.includes('perception:')){
      setTimeout(()=>log(`perception: ${G.per}. some things are decided before you wake up.`,cls),t);return;
    }
    setTimeout(()=>log(txt,cls),t);
  });
  TICK_ID=setInterval(tick,1000);
  setTimeout(updateStats,100);
}

init();
</script>
