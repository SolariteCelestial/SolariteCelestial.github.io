<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dust &amp; Darkness</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080806;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Share Tech Mono',monospace}
.game-wrap{background:#0d0d0b;color:#c8b882;width:700px;max-width:100vw;border-radius:8px;overflow:hidden;border:1px solid #3a3520;display:flex;flex-direction:column;height:96vh;max-height:700px}
.game-header{background:#111008;border-bottom:1px solid #3a3520;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.game-title{font-family:'Special Elite',serif;font-size:17px;color:#d4a843;letter-spacing:3px;text-transform:uppercase}
.day-badge{font-size:11px;color:#777;background:#1a1a12;border:1px solid #3a3520;padding:3px 12px;border-radius:4px}
.day-badge span{color:#d4a843}
.game-body{display:flex;flex:1;min-height:0}
.sidebar{width:165px;flex-shrink:0;background:#0b0b08;border-right:1px solid #2a2418;padding:12px 10px;display:flex;flex-direction:column;gap:11px;overflow-y:auto}
.stat-block{display:flex;flex-direction:column;gap:4px}
.stat-label{font-size:10px;color:#555;letter-spacing:1.5px;text-transform:uppercase}
.stat-bar-bg{background:#1a1a12;height:8px;border-radius:2px;border:1px solid #2a2418;overflow:hidden}
.stat-bar{height:100%;border-radius:2px;transition:width 0.4s}
.stat-val{font-size:11px;color:#777;text-align:right}
.inv-title{font-size:10px;color:#555;letter-spacing:1.5px;text-transform:uppercase;border-top:1px solid #2a2418;padding-top:10px}
.inv-list{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.inv-item{font-size:11px;color:#a08850;background:#141410;border:1px solid #2a2418;padding:3px 7px;border-radius:2px}
.inv-empty{font-size:11px;color:#3a3a30;font-style:italic}
.loc-title{font-size:10px;color:#555;letter-spacing:1.5px;text-transform:uppercase;border-top:1px solid #2a2418;padding-top:10px}
.loc-list{display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.loc-item{font-size:10px;background:#141410;border:1px solid #2a2418;padding:3px 7px;border-radius:2px;line-height:1.4}
.loc-item .loc-name{display:block;font-size:11px}
.loc-item .loc-note{display:block;color:#555;font-size:9px;margin-top:1px;font-style:italic}
.loc-item.settlement{border-left:2px solid #3a6b2a}.loc-item.settlement .loc-name{color:#78a858}
.loc-item.outpost{border-left:2px solid #6a5a28}.loc-item.outpost .loc-name{color:#d4a843}
.loc-item.raider_camp{border-left:2px solid #8b2020}.loc-item.raider_camp .loc-name{color:#c87070}
.loc-item.ruin{border-left:2px solid #333}.loc-item.ruin .loc-name{color:#777}
.loc-item.danger_zone{border-left:2px solid #7a4a10}.loc-item.danger_zone .loc-name{color:#d4840a}
.loc-item.unknown{border-left:2px solid #2a2418}.loc-item.unknown .loc-name{color:#555}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0}
.narrative-log{flex:1;padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.log-entry{border-left:2px solid #3a3520;padding:4px 11px;font-size:13px;line-height:1.65;color:#b8a872;animation:fadeIn 0.35s}
.log-entry.system{color:#666;font-size:11px;border-left-color:#222018;font-style:italic}
.log-entry.danger{border-left-color:#8b2020;color:#c87070}
.log-entry.good{border-left-color:#3a6b2a;color:#78a858}
.options-area{padding:6px 14px 4px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.option-btn{background:#111008;border:1px solid #3a3520;color:#c8b882;padding:6px 11px;font-family:'Share Tech Mono',monospace;font-size:12px;cursor:pointer;text-align:left;border-radius:3px;transition:all 0.15s}
.option-btn:hover{background:#1e1c10;border-color:#6a5a28;color:#e8d8a2}
.option-btn:disabled{opacity:0.35;cursor:not-allowed}
.input-area{border-top:1px solid #2a2418;padding:9px 12px;display:flex;gap:8px;background:#0b0b08;flex-shrink:0}
.cmd-input{flex:1;background:#111008;border:1px solid #3a3520;color:#c8b882;font-family:'Share Tech Mono',monospace;font-size:13px;padding:7px 11px;border-radius:3px;outline:none}
.cmd-input:focus{border-color:#6a5a28}
.cmd-input::placeholder{color:#3a3a30}
.send-btn{background:#1e1c10;border:1px solid #5a4a20;color:#d4a843;font-family:'Share Tech Mono',monospace;font-size:12px;padding:7px 16px;cursor:pointer;border-radius:3px;white-space:nowrap}
.send-btn:hover:not(:disabled){background:#2a2818;border-color:#8a7030}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}
.level-badge{font-size:10px;color:#8a6828;text-align:center;border:1px solid #2a2418;padding:3px 4px;border-radius:2px;letter-spacing:1px}
.xp-bar-bg{background:#1a1a12;height:3px;border-radius:2px;overflow:hidden}
.xp-bar{height:100%;background:#5a3a10;border-radius:2px;transition:width 0.4s}
.prompt-toggle{font-size:10px;color:#444;cursor:pointer;padding:5px 16px;background:#0a0a08;border-top:1px solid #1a1a10;text-align:center;flex-shrink:0;user-select:none}
.prompt-toggle:hover{color:#777}
.prompt-box{background:#080807;border-top:1px solid #1a1a10;padding:12px 16px;font-size:10px;color:#4a4a38;line-height:1.7;max-height:130px;overflow-y:auto;display:none;font-family:'Share Tech Mono',monospace;flex-shrink:0;white-space:pre-wrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="game-wrap" id="gw">
  <div class="game-header">
    <div class="game-title">☢ Dust &amp; Darkness</div>
    <div class="day-badge">Day <span id="dayNum">1</span> &mdash; <span id="timeLabel">Dawn</span></div>
  </div>
  <div class="game-body">
    <div class="sidebar">
      <div class="stat-block">
        <div class="stat-label">Health</div>
        <div class="stat-bar-bg"><div class="stat-bar" id="hpBar" style="width:80%;background:#8b2020"></div></div>
        <div class="stat-val" id="hpVal">80/100</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Hunger</div>
        <div class="stat-bar-bg"><div class="stat-bar" id="hunBar" style="width:70%;background:#8b5a10"></div></div>
        <div class="stat-val" id="hunVal">70/100</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Sanity</div>
        <div class="stat-bar-bg"><div class="stat-bar" id="sanBar" style="width:60%;background:#3a3a8b"></div></div>
        <div class="stat-val" id="sanVal">60/100</div>
      </div>
      <div>
        <div class="level-badge" id="lvlBadge">LEVEL 1 — SURVIVOR</div>
        <div class="xp-bar-bg" style="margin-top:4px"><div class="xp-bar" id="xpBar" style="width:0%"></div></div>
      </div>
      <div class="inv-title">Inventory</div>
      <div class="inv-list" id="invList"><div class="inv-empty">empty pockets</div></div>
      <div class="loc-title">Locations</div>
      <div class="loc-list" id="locList"><div class="inv-empty">none mapped</div></div>
    </div>
    <div class="main-area">
      <div class="narrative-log" id="log"></div>
      <div class="options-area" id="optArea"></div>
      <div class="input-area">
        <input class="cmd-input" id="cmdInput" placeholder="what do you do..." maxlength="120"/>
        <button class="send-btn" id="sendBtn" onclick="sendAction()">ACT →</button>
      </div>
    </div>
  </div>
  <div class="prompt-toggle" onclick="togglePrompt()">[ view ai system prompt ]</div>
  <div class="prompt-box" id="promptBox"></div>
</div>

<script>
const SYSTEM_PROMPT = `You are the narrator of DUST & DARKNESS — a brutal post-apocalyptic survival RPG fusing Fallout's wasteland RPG with Don't Starve's unforgiving mechanics. The world: nuclear war ended 40 years ago. Mutant creatures stalk irradiated ruins. Night brings shadow beasts. The player scavenges to survive.

STATS: hp (0-100), hunger (0-100), sanity (0-100). Hunger below 20 drains hp. Sanity below 20 causes hallucinations. Night raises danger.

TONE: Dark, literary, brutal. Short vivid sentences. No warmth.

Respond ONLY with a valid JSON object (no markdown, no extra text):
{
  "narrative": "2-4 tense sentences describing what happens",
  "hpChange": <integer -25 to +15>,
  "hungerChange": <integer -20 to +8>,
  "sanityChange": <integer -15 to +10>,
  "itemGained": <"item name" or null>,
  "xpGain": <integer 0 to 30>,
  "locationDiscovered": <{"name":"location name","type":"settlement|outpost|raider_camp|ruin|danger_zone|unknown","notes":"one short grim phrase"} or null>,
  "options": ["short option 1","short option 2","short option 3"]
}

Rules: Be brutal but fair. Reward smart survival. Punish recklessness. Items are scarce. Danger escalates at night. Occasionally let the player find something useful. Make options meaningful tradeoffs. Discover a named location (locationDiscovered) when the player meaningfully explores a new place — ruins, camps, settlements. Do not repeat already-known locations.`;

document.getElementById('promptBox').textContent = SYSTEM_PROMPT;

let state = {
  hp: 80, hunger: 70, sanity: 60,
  day: 1, hour: 6, isNight: false,
  inventory: [], level: 1, xp: 0,
  busy: false, locations: [],
  history: []
};

const XP_PER_LEVEL = 100;
const LEVEL_TITLES = ['Survivor','Drifter','Scavenger','Raider','Warlord','Ghost'];

function updateUI() {
  document.getElementById('hpBar').style.width = Math.max(0, state.hp) + '%';
  document.getElementById('hpVal').textContent = Math.max(0, Math.round(state.hp)) + '/100';
  document.getElementById('hunBar').style.width = Math.max(0, state.hunger) + '%';
  document.getElementById('hunVal').textContent = Math.max(0, Math.round(state.hunger)) + '/100';
  document.getElementById('sanBar').style.width = Math.max(0, state.sanity) + '%';
  document.getElementById('sanVal').textContent = Math.max(0, Math.round(state.sanity)) + '/100';
  document.getElementById('hpBar').style.background = state.hp > 40 ? '#8b2020' : '#dd3030';
  document.getElementById('hunBar').style.background = state.hunger > 30 ? '#8b5a10' : '#d4840a';
  document.getElementById('sanBar').style.background = state.sanity > 30 ? '#3a3a8b' : '#7070d0';
  document.getElementById('dayNum').textContent = state.day;
  const h = state.hour;
  let timeStr = h < 6 ? 'Night' : h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : h < 20 ? 'Dusk' : 'Night';
  state.isNight = h >= 20 || h < 6;
  document.getElementById('timeLabel').textContent = timeStr;
  const xpPct = (state.xp % (state.level * XP_PER_LEVEL)) / (state.level * XP_PER_LEVEL) * 100;
  document.getElementById('xpBar').style.width = xpPct + '%';
  const lvlIdx = Math.min(state.level - 1, LEVEL_TITLES.length - 1);
  document.getElementById('lvlBadge').textContent = 'LEVEL ' + state.level + ' — ' + LEVEL_TITLES[lvlIdx];
  const invList = document.getElementById('invList');
  invList.innerHTML = state.inventory.length === 0
    ? '<div class="inv-empty">empty pockets</div>'
    : state.inventory.map(i => '<div class="inv-item">• ' + i + '</div>').join('');
  const LOC_ICONS = {settlement:'⌂',outpost:'⚑',raider_camp:'☠',ruin:'◫',danger_zone:'☢',unknown:'?'};
  const locList = document.getElementById('locList');
  locList.innerHTML = state.locations.length === 0
    ? '<div class="inv-empty">none mapped</div>'
    : state.locations.map(l => {
        const t = l.type || 'unknown';
        const icon = LOC_ICONS[t] || '?';
        return `<div class="loc-item ${t}"><span class="loc-name">${icon} ${l.name}</span>${l.notes ? '<span class="loc-note">' + l.notes + '</span>' : ''}</div>`;
      }).join('');
}

function addLog(text, type) {
  const log = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'log-entry' + (type ? ' ' + type : '');
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function setOptions(opts) {
  const area = document.getElementById('optArea');
  area.innerHTML = '';
  (opts || []).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = '▸ ' + opt;
    btn.disabled = state.busy;
    btn.onclick = () => { document.getElementById('cmdInput').value = opt; sendAction(); };
    area.appendChild(btn);
  });
}

function setBusy(v) {
  state.busy = v;
  document.getElementById('sendBtn').disabled = v;
  document.getElementById('cmdInput').disabled = v;
  document.getElementById('sendBtn').textContent = v ? '...' : 'ACT →';
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = v);
}

async function sendAction() {
  const input = document.getElementById('cmdInput');
  const action = input.value.trim();
  if (!action || state.busy) return;
  if (state.hp <= 0) { addLog('You are dead. Refresh to begin again.', 'danger'); return; }
  input.value = '';
  setBusy(true);
  addLog('> ' + action, 'system');

  state.hour = (state.hour + 2) % 24;
  if (state.hour === 0) {
    state.day++;
    addLog('Day ' + state.day + ' dawns. The wasteland does not rest.', 'system');
  }
  if (state.hour === 20) addLog('Night falls. The shadow beasts stir.', 'danger');

  const userMsg = {
    role: 'user',
    content: `Current state: HP=${Math.round(state.hp)}, Hunger=${Math.round(state.hunger)}, Sanity=${Math.round(state.sanity)}, Day=${state.day}, Time=${state.isNight?'Night':'Day'}, Inventory=[${state.inventory.join(', ')||'nothing'}], Level=${state.level}, KnownLocations=[${state.locations.map(l=>l.name).join(', ')||'none'}]\nPlayer action: "${action}"`
  };

  const msgs = [...state.history, userMsg];

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        system: SYSTEM_PROMPT,
        messages: msgs
      })
    });
    const data = await res.json();
    const raw = (data.content?.[0]?.text || '{}').replace(/```json|```/g,'').trim();
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch(e) { parsed = {narrative:'The wasteland offers no answer.',hpChange:0,hungerChange:-3,sanityChange:-2,xpGain:2,options:['Look around','Search for food','Rest']}; }

    state.history.push(userMsg);
    state.history.push({role:'assistant', content: raw});
    if (state.history.length > 14) state.history = state.history.slice(-14);

    const hpChg = parsed.hpChange || 0;
    const hunChg = parsed.hungerChange || 0;
    const sanChg = parsed.sanityChange || 0;
    const xpGain = parsed.xpGain || 5;

    state.hp = Math.min(100, Math.max(0, state.hp + hpChg));
    state.hunger = Math.min(100, Math.max(0, state.hunger + hunChg));
    state.sanity = Math.min(100, Math.max(0, state.sanity + sanChg));
    state.xp += xpGain;

    if (state.xp >= state.level * XP_PER_LEVEL) {
      state.level++;
      addLog('LEVEL UP → Level ' + state.level + ' — ' + (LEVEL_TITLES[Math.min(state.level-1, LEVEL_TITLES.length-1)]), 'good');
    }
    if (state.hunger < 20 && state.hp > 0) {
      state.hp = Math.max(0, state.hp - 5);
      addLog('Starvation gnaws. Your vision dims.', 'danger');
    }
    if (state.sanity < 20) addLog('The shadows whisper your name. None of it is real. Probably.', 'danger');
    if (parsed.itemGained) {
      state.inventory.push(parsed.itemGained);
      addLog('+ Found: ' + parsed.itemGained, 'good');
    }
    if (parsed.locationDiscovered && parsed.locationDiscovered.name) {
      const loc = parsed.locationDiscovered;
      const already = state.locations.some(l => l.name.toLowerCase() === loc.name.toLowerCase());
      if (!already) {
        state.locations.push(loc);
        const typeLabel = loc.type ? loc.type.replace('_',' ') : 'location';
        addLog('◉ Mapped: ' + loc.name + ' [' + typeLabel + ']', 'good');
      }
    }

    const logType = hpChg < -10 ? 'danger' : (hpChg > 0 || hunChg > 0) ? 'good' : '';
    addLog(parsed.narrative || 'Nothing happens.', logType);

    if (state.hp <= 0) {
      addLog('YOU ARE DEAD. The wasteland claims another soul.', 'danger');
      document.getElementById('optArea').innerHTML = '';
    } else {
      setOptions(parsed.options || ['Look around','Search for food','Rest here']);
    }
    updateUI();
  } catch(err) {
    addLog('Static. The signal is lost. Try again.', 'system');
    setBusy(false);
    return;
  }
  setBusy(false);
}

document.getElementById('cmdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendAction();
});

function togglePrompt() {
  const pb = document.getElementById('promptBox');
  pb.style.display = pb.style.display === 'block' ? 'none' : 'block';
}

async function startGame() {
  setBusy(true);
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 400,
        system: SYSTEM_PROMPT,
        messages: [{role:'user', content:'Start the game. The player wakes at dawn in the wasteland, injured and hungry. HP=80, Hunger=70, Sanity=60. Set the scene vividly.'}]
      })
    });
    const data = await res.json();
    const raw = (data.content?.[0]?.text || '{}').replace(/```json|```/g,'').trim();
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch(e) { parsed = {narrative:'You wake in the ash. The sky is the colour of old blood. Something moved in the ruins to the west, and it was not the wind.',options:['Search the ruins to the west','Scavenge for food','Tend to your wounds']}; }
    state.history.push({role:'user', content:'Start the game.'});
    state.history.push({role:'assistant', content: raw});
    addLog(parsed.narrative, '');
    setOptions(parsed.options || ['Search the ruins','Scavenge for food','Rest']);
    updateUI();
  } catch(e) {
    addLog('You wake in the ash. The sky is the colour of old blood. Somewhere, something is burning.', '');
    setOptions(['Search nearby ruins','Look for food','Check your wounds']);
  }
  setBusy(false);
}

updateUI();
startGame();
</script>
</body>
</html>
