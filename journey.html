<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasteland Drifter: A Survival RPG Prototype</title>
    <style>
        /* CSS Reset and basic styling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Courier New', Courier, monospace;
            color: #ddd;
            user-select: none;
        }

        #gameCanvas {
            display: block;
        }

        /* UI Overlay Styling */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #555;
            padding: 15px;
            border-radius: 8px;
            pointer-events: auto; /* Re-enable interactions for UI elements */
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        #top-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #stats-bar {
            width: 300px;
        }

        .bar-container {
            width: 100%;
            background: #333;
            height: 15px;
            margin: 5px 0 10px 0;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #222;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s;
        }

        #health-fill { background: #d32f2f; }
        #rad-fill { background: #388e3c; }

        #inventory-panel {
            min-width: 200px;
        }

        .inv-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 16px;
        }

        #crafting-panel {
            align-self: flex-start;
            margin-top: auto;
        }

        button {
            background: #444;
            color: white;
            border: 1px solid #777;
            padding: 10px 15px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
        }

        button:hover { background: #555; }
        button:disabled { background: #222; color: #555; cursor: not-allowed; }

        #notification-area {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }

        .toast {
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 20px;
            margin-top: 5px;
            animation: fadeout 2s forwards;
            font-weight: bold;
        }

        @keyframes fadeout {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* Borderlands-style Loot Colors */
        .rarity-common { color: #ffffff; }
        .rarity-uncommon { color: #00ff00; }
        .rarity-rare { color: #0070dd; }
        .rarity-epic { color: #a335ee; }
        .rarity-legendary { color: #ff8000; }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="top-hud">
            <div id="stats-bar" class="hud-panel">
                <div>Health: <span id="hp-val">100</span>/100</div>
                <div class="bar-container"><div id="health-fill" style="width: 100%;"></div></div>
                
                <div>Radiation: <span id="rad-val">0</span>/100</div>
                <div class="bar-container"><div id="rad-fill" style="width: 0%;"></div></div>
                
                <div style="margin-top: 10px; font-size: 14px; color: #aaa;">
                    Time: <span id="time-val">Day</span>
                </div>
            </div>

            <div id="inventory-panel" class="hud-panel">
                <h3>🎒 Inventory</h3>
                <div class="inv-item"><span>Scrap ⚙️:</span> <span id="inv-scrap">0</span></div>
                <div class="inv-item"><span>Wood 🌲:</span> <span id="inv-wood">0</span></div>
                <div class="inv-item"><span>Tech 🔋:</span> <span id="inv-tech">0</span></div>
                <div class="inv-item" style="margin-top: 10px; border-top: 1px solid #555; padding-top: 5px;">
                    <span>Weapon:</span> <span id="inv-weapon" class="rarity-common">Fists</span>
                </div>
            </div>
        </div>

        <div id="crafting-panel" class="hud-panel">
            <h3>🛠️ Workbench</h3>
            <button id="craft-btn" onclick="craftWeapon()">
                Craft Spiked Bat <br><span style="font-size: 12px;">(10 Wood, 5 Scrap)</span>
            </button>
        </div>
    </div>

    <div id="notification-area"></div>

    <script>
        /**
         * ENGINE SETUP
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to fill window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /**
         * GAME CONFIGURATION & STATE
         */
        const WORLD_SIZE = 3000;
        const TILE_SIZE = 40;

        const STATE = {
            lastTime: 0,
            dayTime: 0, // 0 to 1 cycle
            isDay: true,
            camera: { x: 0, y: 0 }
        };

        const INPUT = {
            up: false, down: false, left: false, right: false
        };

        /**
         * ENTITY CLASSES
         */
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speed = 250; // pixels per second
                this.size = 30;
                this.hp = 100;
                this.maxHp = 100;
                this.rads = 0;
                this.maxRads = 100;
                this.damage = 10; // Fists
                this.inventory = { scrap: 0, wood: 0, tech: 0, weapon: 'Fists' };
                this.emoji = '🧑‍🚀';
            }

            update(dt) {
                let dx = 0; let dy = 0;
                if (INPUT.up) dy -= 1;
                if (INPUT.down) dy += 1;
                if (INPUT.left) dx -= 1;
                if (INPUT.right) dx += 1;

                // Normalize diagonal movement
                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length;
                    dy /= length;
                }

                // Move and clamp to world bounds
                this.x += dx * this.speed * dt;
                this.y += dy * this.speed * dt;
                
                this.x = Math.max(this.size, Math.min(WORLD_SIZE - this.size, this.x));
                this.y = Math.max(this.size, Math.min(WORLD_SIZE - this.size, this.y));

                // Environmental Hazards (Radiation builds up faster at night)
                const radRate = STATE.isDay ? 0.5 : 2.0;
                this.rads += radRate * dt;
                
                if (this.rads >= this.maxRads) {
                    this.rads = this.maxRads;
                    this.hp -= 5 * dt; // Take damage if max rads
                }

                if (this.hp <= 0) {
                    this.hp = 0;
                    showToast("You succumbed to the wasteland. Refresh to restart.", "rarity-legendary");
                    this.speed = 0; // Dead
                }
            }

            draw(ctx) {
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.emoji, this.x, this.y);
            }
        }

        class Enemy {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 25;
                this.speed = 100 + Math.random() * 50;
                this.hp = 30;
                this.damage = 15;
                this.attackCooldown = 0;
                this.emoji = '🧟';
                this.active = true;
            }

            update(dt, player) {
                if (!this.active || player.hp <= 0) return;

                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Move towards player if within aggro range
                if (dist < 600 && dist > this.size) {
                    this.x += (dx / dist) * this.speed * dt;
                    this.y += (dy / dist) * this.speed * dt;
                }

                // Attack logic
                if (this.attackCooldown > 0) this.attackCooldown -= dt;
                
                if (dist < this.size + player.size && this.attackCooldown <= 0) {
                    player.hp -= this.damage;
                    this.attackCooldown = 1.5; // 1.5 seconds between attacks
                    showToast("Mutant hit you!", "rarity-common");
                    
                    // Simple combat: player auto-retaliates on collision
                    this.hp -= player.damage;
                    if (this.hp <= 0) {
                        this.active = false;
                        spawnLoot(this.x, this.y, true); // Enemy drops better loot
                    }
                }
            }

            draw(ctx) {
                if (!this.active) return;
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.emoji, this.x, this.y);
            }
        }

        class ResourceNode {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'wood' or 'scrap'
                this.size = 35;
                this.active = true;
                this.emoji = type === 'wood' ? '🌲' : '🏚️';
            }

            draw(ctx) {
                if (!this.active) return;
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.emoji, this.x, this.y);
            }
        }

        class Loot {
            constructor(x, y, type, amount, rarity) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.amount = amount;
                this.rarity = rarity; // common, uncommon, rare, etc.
                this.active = true;
                this.size = 20;
                
                // Assign emoji based on type
                if (type === 'wood') this.emoji = '🪵';
                else if (type === 'scrap') this.emoji = '⚙️';
                else this.emoji = '🔋'; // tech
            }

            draw(ctx) {
                if (!this.active) return;
                
                // Borderlands style colored aura around loot
                ctx.beginPath();
                ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
                let color = '#fff';
                if (this.rarity === 'uncommon') color = '#00ff00';
                if (this.rarity === 'rare') color = '#0070dd';
                if (this.rarity === 'epic') color = '#a335ee';
                if (this.rarity === 'legendary') color = '#ff8000';
                
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.3;
                ctx.fill();
                ctx.globalAlpha = 1.0;

                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.emoji, this.x, this.y);
            }
        }

        /**
         * WORLD GENERATION & ARRAYS
         */
        const player = new Player(WORLD_SIZE / 2, WORLD_SIZE / 2);
        const enemies = [];
        const resources = [];
        const loots = [];

        function generateWorld() {
            // Generate Resources (Crashlands/Don't Starve style scattering)
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * WORLD_SIZE;
                const y = Math.random() * WORLD_SIZE;
                const type = Math.random() > 0.4 ? 'wood' : 'scrap';
                resources.push(new ResourceNode(x, y, type));
            }

            // Generate initial Enemies
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * WORLD_SIZE;
                const y = Math.random() * WORLD_SIZE;
                // Don't spawn too close to player
                if (Math.abs(x - player.x) > 400 && Math.abs(y - player.y) > 400) {
                    enemies.push(new Enemy(x, y));
                }
            }
        }

        function spawnLoot(x, y, isEnemyDrop = false) {
            // Loot table logic (Borderlands style)
            const roll = Math.random();
            let type = 'wood';
            let rarity = 'common';
            let amount = 1;

            if (isEnemyDrop) {
                if (roll > 0.9) { type = 'tech'; rarity = 'epic'; amount = 1; }
                else if (roll > 0.5) { type = 'scrap'; rarity = 'rare'; amount = 2; }
                else { type = 'scrap'; rarity = 'uncommon'; amount = 1; }
            } else {
                if (roll > 0.95) { type = 'tech'; rarity = 'rare'; amount = 1; }
                else if (roll > 0.7) { type = 'scrap'; rarity = 'common'; amount = 1; }
                else { type = 'wood'; rarity = 'common'; amount = 2; }
            }

            loots.push(new Loot(x + (Math.random()*20-10), y + (Math.random()*20-10), type, amount, rarity));
        }

        /**
         * INPUT HANDLING
         */
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') INPUT.up = true;
            if (e.key === 's' || e.key === 'ArrowDown') INPUT.down = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') INPUT.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') INPUT.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') INPUT.up = false;
            if (e.key === 's' || e.key === 'ArrowDown') INPUT.down = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') INPUT.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') INPUT.right = false;
        });

        /**
         * UI & CRAFTING
         */
        function updateUI() {
            document.getElementById('hp-val').innerText = Math.floor(player.hp);
            document.getElementById('health-fill').style.width = `${(Math.floor(player.hp) / player.maxHp) * 100}%`;
            
            document.getElementById('rad-val').innerText = Math.floor(player.rads);
            document.getElementById('rad-fill').style.width = `${(Math.floor(player.rads) / player.maxRads) * 100}%`;

            document.getElementById('time-val').innerText = STATE.isDay ? "Daytime (Safe)" : "Night (High Rads!)";
            document.getElementById('time-val').style.color = STATE.isDay ? "#ddaa00" : "#aa0000";

            document.getElementById('inv-scrap').innerText = player.inventory.scrap;
            document.getElementById('inv-wood').innerText = player.inventory.wood;
            document.getElementById('inv-tech').innerText = player.inventory.tech;
            
            const wp = document.getElementById('inv-weapon');
            wp.innerText = player.inventory.weapon;
            wp.className = player.inventory.weapon === 'Fists' ? 'rarity-common' : 'rarity-rare';

            // Crafting button state
            const craftBtn = document.getElementById('craft-btn');
            if (player.inventory.wood >= 10 && player.inventory.scrap >= 5 && player.inventory.weapon !== 'Spiked Bat') {
                craftBtn.disabled = false;
            } else {
                craftBtn.disabled = true;
            }
        }

        function showToast(message, rarityClass = "rarity-common") {
            const area = document.getElementById('notification-area');
            const toast = document.createElement('div');
            toast.className = `toast ${rarityClass}`;
            toast.innerText = message;
            area.appendChild(toast);
            setTimeout(() => { if (area.contains(toast)) area.removeChild(toast); }, 2000);
        }

        // Expose to window for inline onclick handler
        window.craftWeapon = function() {
            if (player.inventory.wood >= 10 && player.inventory.scrap >= 5) {
                player.inventory.wood -= 10;
                player.inventory.scrap -= 5;
                player.inventory.weapon = 'Spiked Bat';
                player.damage = 40; // Massive damage boost
                showToast("Crafted Spiked Bat! Damage increased.", "rarity-rare");
                updateUI();
            }
        };

        /**
         * GAME LOOP & SYSTEMS
         */
        function update(dt) {
            // Update time of day (1 cycle every 60 seconds)
            STATE.dayTime += dt / 60;
            if (STATE.dayTime > 1) STATE.dayTime -= 1;
            STATE.isDay = STATE.dayTime < 0.5;

            // Update Player
            player.update(dt);

            // Camera follow logic (centered on player)
            STATE.camera.x = player.x - canvas.width / 2;
            STATE.camera.y = player.y - canvas.height / 2;

            // Clamp camera to world bounds
            STATE.camera.x = Math.max(0, Math.min(WORLD_SIZE - canvas.width, STATE.camera.x));
            STATE.camera.y = Math.max(0, Math.min(WORLD_SIZE - canvas.height, STATE.camera.y));

            // Update Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.update(dt, player);
                if (!enemy.active) enemies.splice(i, 1);
            }

            // Resource Interaction (Auto-harvest on collision)
            for (let i = resources.length - 1; i >= 0; i--) {
                const res = resources[i];
                const dist = Math.hypot(player.x - res.x, player.y - res.y);
                if (dist < player.size + res.size - 10) {
                    spawnLoot(res.x, res.y, false);
                    resources.splice(i, 1);
                    showToast("Harvested resource node");
                }
            }

            // Loot Collection
            for (let i = loots.length - 1; i >= 0; i--) {
                const loot = loots[i];
                const dist = Math.hypot(player.x - loot.x, player.y - loot.y);
                if (dist < player.size + loot.size) {
                    player.inventory[loot.type] += loot.amount;
                    showToast(`Picked up ${loot.amount} ${loot.type}`, `rarity-${loot.rarity}`);
                    loots.splice(i, 1);
                }
            }

            updateUI();
        }

        function draw() {
            // Clear screen
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Apply Camera Transform
            ctx.save();
            ctx.translate(-STATE.camera.x, -STATE.camera.y);

            // Draw World Bounds (Wasteland Floor)
            ctx.fillStyle = '#2c2925';
            ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);
            
            // Draw grid for texture
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 2;
            for(let x=0; x<WORLD_SIZE; x+=200) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
            }
            for(let y=0; y<WORLD_SIZE; y+=200) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
            }

            // Draw Entities (Z-sorting roughly by rendering order)
            resources.forEach(r => r.draw(ctx));
            loots.forEach(l => l.draw(ctx));
            enemies.forEach(e => e.draw(ctx));
            player.draw(ctx);

            ctx.restore(); // Remove camera transform

            // Draw Day/Night Overlay (Fallout/Don't Starve atmosphere)
            if (!STATE.isDay) {
                // Calculate night darkness intensity based on time
                let intensity = Math.sin((STATE.dayTime - 0.5) * Math.PI * 2);
                if(intensity < 0) intensity = 0;
                
                ctx.fillStyle = `rgba(10, 20, 0, ${intensity * 0.7})`; // Sickly green radioactive night
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function gameLoop(timestamp) {
            // Calculate Delta Time in seconds
            let dt = (timestamp - STATE.lastTime) / 1000;
            if (dt > 0.1) dt = 0.1; // Cap dt to prevent massive jumps if tab is backgrounded
            STATE.lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        // Initialization
        generateWorld();
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
